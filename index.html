<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lottery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
    <script src="ui.js" defer></script>
</head>
<body>
    <div id="head">
        <div id="logoSection">
            <h1 id="heading">TheLottery</h1>
            <h2 id="subHeading">TRY YOUR LUCK</h2>
        </div>
        <div id="navSection">
            <nav>
                <ul>
                    <!--These will bring up modal windows in front-->
                    <li><button>HOW TO PLAY</button></li>
                    <li><button>RESULTS</button></li>
                    <li><button>SETTINGS</button></li>
                </ul>
            </nav>
        </div>
    </div>
    <div id="mainContent">
        <div id="main">
            <div id="winningNumberSection">
                <div id ="winningHeading">
                    <h3>* WINNING NUMBERS</h3>
                    <h4>DRAW #0</h4>
                </div>
                <div id="winningBallsSection">
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>
                    </div>
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>  
                    </div>
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>
                    </div>
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>
                    </div>
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>
                    </div>
                    <div class="ballSection">
                        <div class="ball">
                            ?
                        </div>
                    </div>
                    <div class="ballSection powerball">
                        <div class="ball powerball">
                            ?
                        </div>
                    </div>
                </div>

            </div>
            <div id="playerTicketSection">
                <h3>* YOUR TICKETS</h3>
                <div id="playerTickets">
                    <!--Example ticket, will be generated in JS script-->
                    <div class="ticket">
                        <div class="ticketContainer">
                            <h4>Ticket #1</h4>
                            <div class="ticketBalls">
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ball">
                                    ?
                                </div>
                                <div class="ballSection powerball">
                                    <div class="ball powerball">
                                        ?
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ticketEnd">
                            <div class="matchedNum">
                                ? matched
                            </div>
                            <div class="ticketCost">
                                $0.00
                            </div>
                        </div>
                    </div>
                    <div class="ticket" id="buyAnother">
                        <button>+ BUY A TICKET</button>
                    </div>
                    
                </div>

            </div>
            <div id="nextWeekSection">
                <button id="play">Play!</button>
            </div>
            <div id="winSection">
                <div id="latestWin">

                </div>
                <div id="allTicketsTab">

                </div>
            </div>

            <div id="newsSection">
                <h3>* LATEST NEWS</h3>
                <div id="newsBar">
                    <!--Will update whenever 
                    - Jackpot reaches a certain amount (And then every week after)
                    - Someone wins
                    - You lose a certain amount of money-->
                    <div class="newsBox">
                        <div class="newsHead"></div>
                        <div class="newsBlurb"></div>
                        <div class="newsFoot"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="sideBar">
            <div id="sideHeading">
                <h3>* YOUR STATS</h3>
            </div>
            <div id="sideContent">
                <div id="playerInfo">
                    <div class="sideSection">
                        <h4>CURRENT MONEY</h4>
                        <span id="currentMoney">$?</span>
                    </div>
                    <div class="sideSection">
                        <h4>TOTAL SPENT</h4>
                        <span id="totalSpent">$?</span>
                    </div>
                    <div class="sideSection">
                        <h4>TOTAL WON</h4>
                        <span id="totalWon">$?</span>
                        
                    </div>
                    <div class="sideSection">
                        <h4>TICKETS BOUGHT</h4>
                        <span id="ticketsBought">0</span>
                    </div>
                </div>
                <div id="drawInfo">
                    <div class="sideSection">
                        <!--Jackpot might instead be over winning numbers-->
                        <h4>CURRENT JACKPOT</h4>
                        <span id="jackpot">$?</span>
                    </div>
                    <div class="sideSection">
                        <h4>NEXT DRAW</h4>
                        <span id="drawDate">0/0/0000</span>
                        
                    </div>
                    <div class="sideSection">
                        <h4>PRIZE BREAKDOWN</h4>
                        <span id="prizeBreakdown">0</span>
                        
                    </div>    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
